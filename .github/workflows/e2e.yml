name: E2E

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The suites live in tests/e2e: the Go tests drive vfox, the plugin, the
# host installs and the Docker containers; this file only provisions Go.
jobs:
  e2e-linux:
    name: E2E on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Run the Linux E2E suite
        run: go test -v -timeout 85m ./linux
        working-directory: tests/e2e

  e2e-windows:
    name: E2E on Windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Run the Windows E2E suite
        run: go test -v -timeout 85m ./windows
        working-directory: tests/e2e
